title:        Venky Gangisetti
description:  Notes, ideas, and things I'm learning.
author:       Venky Gangisetti
email:        venkygangisetti@proton.me
url:          https://venkman.in
baseurl:      ''

social:
  github:  venkman00
  x:       venkmangang

include:      ['_pages']
exclude:      ['bin', '_includes/notes_graph.json', 'README.md', 'LICENSE', 'Gemfile', 'Gemfile.lock', 'vendor']

use_html_extension:  false
open_external_links_in_new_tab: true
embed_tweets: false

permalink:           pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at
  - jekyll-redirect-from

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
